name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build (release)
        run: swift build -c release
      - name: CLI help
        run: ./.build/release/gpucomm --help
      - name: GPU resources present in the bundle
        # Guards against the resource regression where .process compiled
        # Kernels.metal into default.metallib and dropped the source, so the
        # binary built cleanly but failed at startup.
        run: |
          set -e
          found=0
          for bundle in .build/release/*.bundle; do
            [ -d "$bundle" ] || continue
            found=1
            if [ -f "$bundle/Contents/Resources/Kernels.metal" ]; then
              echo "Kernels.metal present in $bundle"
            else
              echo "::error::Kernels.metal missing from $bundle"
              ls -R "$bundle/Contents/Resources" || true
              exit 1
            fi
          done
          [ "$found" = "1" ] || { echo "::error::no resource bundle produced"; exit 1; }
      - name: Unit tests
        # README drift guard. Reads files as text and never creates a Metal
        # device, so it runs on GPU-less runners.
        run: swift test
      - name: Selftest
        # Runners without a Metal device cannot execute kernels, so this step
        # is skipped rather than failed in that case.
        run: |
          if ! ./.build/release/gpucomm selftest; then
            echo "selftest failed or no Metal device available; skipping"
          fi
